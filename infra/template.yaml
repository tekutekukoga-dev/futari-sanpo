AWSTemplateFormatVersion: "2010-09-09"
Description: ふたり散歩 - ふたりのアルバム（ログイン・記録・写真）

Parameters:
  # 夫婦用ページ（CloudFront）のURL。deploy.sh が自動で入れる。一般公開版（GitHub Pages）からは使えない
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:8765
  # 登録を許可するメールアドレス（カンマ区切り）。リポジトリには置かず、deploy.sh が allowed-emails.txt から渡す
  AllowedEmails:
    Type: String
    NoEcho: true

Resources:
  # 写真の保管場所。公開はせず、アプリには期限付きのURLだけを渡す
  PhotosBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub futari-sanpo-photos-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT]
            AllowedOrigins: !Ref AllowedOrigins
            AllowedHeaders: ["*"]
            MaxAge: 3000

  # 散歩の記録・ペア・招待コード（1つの表にまとめる）
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: futari-sanpo
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ログイン（メールアドレス＋パスワード）
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    Properties:
      UserPoolName: futari-sanpo-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: ふたり散歩の確認コード
        EmailMessage: "ふたり散歩の確認コードは {####} です。アプリの画面に入力してください。"

  # 許可したメールアドレス以外は登録できないようにする
  PreSignUpFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: futari-sanpo-presignup
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt PreSignUpRole.Arn
      Timeout: 5
      Environment:
        Variables:
          ALLOWED_EMAILS: !Ref AllowedEmails
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            const allowed = (process.env.ALLOWED_EMAILS || "").toLowerCase().split(",").map((s) => s.trim()).filter(Boolean);
            const email = String(event.request.userAttributes.email || "").toLowerCase().trim();
            if (!allowed.includes(email)) throw new Error("このメールアドレスでは登録できません");
            return event;
          };
  PreSignUpRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreSignUpFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: futari-sanpo-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      RefreshTokenValidity: 180
      IdTokenValidity: 60
      AccessTokenValidity: 60
      TokenValidityUnits: { RefreshToken: days, IdToken: minutes, AccessToken: minutes }

  # サーバーの処理。自分たちのアルバムの記録と写真にだけ触れられる
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${PhotosBucket.Arn}/pairs/*

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: futari-sanpo-api
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt ApiRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref Table
          BUCKET: !Ref PhotosBucket
      # 本当の処理は deploy.sh で入れ替える
      Code:
        ZipFile: "exports.handler = async () => ({ statusCode: 503, body: 'not deployed yet' });"

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/futari-sanpo-api
      RetentionInDays: 14

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: futari-sanpo-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 3600

  # ログインしている人のトークンだけを通す
  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: [$request.header.Authorization]
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /{proxy+}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      # 使いすぎ・いたずら防止
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  # 夫婦用ページの置き場所。バケットは非公開にして、CloudFront経由でだけ配る
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub futari-sanpo-site-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: futari-sanpo-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ふたり散歩（夫婦用）
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOAC
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWSが用意している「CachingOptimized」。ファイル側のCache-Controlに従う
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

Outputs:
  SiteUrl:
    Value: !Sub https://${SiteDistribution.DomainName}
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref SiteDistribution
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref UserPoolClient
  Bucket:
    Value: !Ref PhotosBucket
